<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request an Event</title>
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/board.css" />
</head>
<body>
    <header class="top"><a class="brand" href="/index.html">UST Angelicum College · Event Management</a><nav id="nav"></nav></header>
    <main style="max-width:820px">
        <div class="card">
            <h1>Request an Event</h1>
            <form id="form" novalidate>
                <label for="title">Event title</label><input type="text" id="title" maxlength="200" />
                <label for="requesterName">Requester name</label><input type="text" id="requesterName" maxlength="150" />
                <label for="organization">Department / Organization / Club</label><input type="text" id="organization" maxlength="150" />
                <label for="role">Role</label>
                <select id="role"><option value="">Select…</option><option value="Faculty">Faculty</option><option value="Student">Student</option></select>

                <label>Target audience</label>
                <div class="checks">
                    <label><input type="checkbox" class="aud" value="1" /> Elementary</label>
                    <label><input type="checkbox" class="aud" value="2" /> JHS</label>
                    <label><input type="checkbox" class="aud" value="4" /> SHS</label>
                    <label><input type="checkbox" class="aud" value="8" /> College</label>
                </div>

                <label for="capacity">Expected attendees (capacity)</label><input type="number" id="capacity" min="1" max="10000" value="50" />
                <label for="purpose">Purpose</label><textarea id="purpose" maxlength="2000"></textarea>
                <label for="start">Start</label><input type="datetime-local" id="start" />
                <label for="end">End</label><input type="datetime-local" id="end" />

                <h2 style="margin-top:26px">Which offices do you need?</h2>
                <div class="hint">Tick each office you need. Then choose its facilities, its equipment, and upload that office's own endorsement letter.</div>
                <div id="deptBox"><div class="spinner">Loading…</div></div>

                <div class="msg" id="msg"></div>
                <div style="margin-top:14px"><button class="btn" type="submit" id="submitBtn">Submit request</button> <a class="btn ghost" href="/dashboard.html">Back</a></div>
            </form>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/request.js"></script>
</body>
</html>
