<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UST Angelicum College – Events</title>
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/board.css" />
</head>
<body>
    <header class="top">
        <a class="brand" href="/index.html">UST Angelicum College · Event Management</a>
        <nav id="nav"></nav>
    </header>

    <main class="home">
        <!-- LEFT: virtual bulletin board -->
        <section>
            <div class="board-head">
                <h1>Bulletin Board</h1>
                <span class="muted">Approved upcoming events on campus</span>
            </div>
            <div class="cork" id="board"></div>
        </section>

        <!-- RIGHT: sign-in box -->
        <aside class="side">
            <div class="card" id="signedOut">
                <h2>Sign in</h2>
                <div class="muted">Use your Angelicum account to register for or request an event.</div>
                <div class="tabs" style="margin-top:12px">
                    <button class="btn" id="tabIn" type="button">Sign in</button>
                    <button class="btn ghost" id="tabUp" type="button">Create account</button>
                </div>
                <form id="authForm">
                    <div id="nameRow" style="display:none"><label>Full name</label><input type="text" id="fullName" /></div>
                    <label>Angelicum email</label><input type="email" id="email" required placeholder="name@angelicum.edu.ph" />
                    <label>Password</label><input type="password" id="password" required minlength="8" />
                    <div class="msg" id="authMsg"></div>
                    <button class="btn" type="submit" id="authSubmit" style="width:100%;margin-top:12px">Sign in</button>
                </form>
            </div>

            <div class="card" id="signedIn" style="display:none">
                <h2>Welcome!</h2>
                <p class="who muted" id="who"></p>
                <div class="stack">
                    <a class="btn gold" href="/dashboard.html">Go to dashboard</a>
                    <a class="btn" href="/request.html">Request an Event</a>
                    <a class="btn ghost" id="adminLink" href="/admin.html" style="display:none">Approvals</a>
                    <button class="btn bad" id="logoutBtn" type="button">Sign out</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="/js/api.js"></script>
    <script>
  renderNav(document.getElementById('nav'));

  // ---------- Side box: signed in vs signed out ----------
  if (Auth.token && Auth.user) {
    document.getElementById('signedOut').style.display = 'none';
    document.getElementById('signedIn').style.display = 'block';
    document.getElementById('who').textContent = Auth.user.fullName + ' · ' + Auth.user.email;
    if (Auth.user.isAdmin) document.getElementById('adminLink').style.display = 'block';
    document.getElementById('logoutBtn').onclick = () => Auth.logout();
  }

  let mode = 'in';
  function setMode(m) {
    mode = m;
    document.getElementById('nameRow').style.display = m === 'up' ? 'block' : 'none';
    document.getElementById('authSubmit').textContent = m === 'up' ? 'Create account' : 'Sign in';
    document.getElementById('tabIn').className = 'btn' + (m === 'in' ? '' : ' ghost');
    document.getElementById('tabUp').className = 'btn' + (m === 'up' ? '' : ' ghost');
  }
  document.getElementById('tabIn').onclick = () => setMode('in');
  document.getElementById('tabUp').onclick = () => setMode('up');

  document.getElementById('authForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = document.getElementById('authMsg');
    try {
      const body = { email: email.value, password: password.value };
      if (mode === 'up') body.fullName = fullName.value;
      const r = await api(mode === 'up' ? '/api/auth/register' : '/api/auth/login', { method: 'POST', body });
      Auth.save(r);
      location.href = r.isAdmin ? '/admin.html' : '/dashboard.html';
    } catch (err) { showMsg(msg, err.message, false); }
  });

  // ---------- Cork board ----------
  const colors = ['yellow', 'pink', 'blue', 'green', 'orange', 'purple'];

  function noteHtml(e, i) {
    const d = new Date(e.startTime);
    const poster = i % 4 === 3 ? ' poster' : '';
    const purpose = e.purpose.length > 120 ? e.purpose.slice(0, 120) + '…' : e.purpose;
    return `
      <article class="note ${colors[e.id % colors.length]} r${i % 5}${poster}">
        <span class="pin"></span>
        <div class="when">
          <div class="day"><b>${d.getDate()}</b><small>${d.toLocaleString([], { month: 'short' })}</small></div>
          <div class="time">${fmtTime(e.startTime)} – ${fmtTime(e.endTime)}</div>
        </div>
        <h3>${esc(e.title)}</h3>
        <div class="org">${esc(e.organization)}</div>
        <p>${esc(purpose)}</p>
        <div class="where">📍 ${esc(e.facilityName)}</div>
        <div class="tags">${e.targetAudience.split(',').map(t => `<span class="tag">${esc(t.trim())}</span>`).join('')}</div>
        <div class="go"><a class="btn" href="/register.html?eventId=${e.id}">Register</a></div>
      </article>`;
  }

  (async () => {
    const board = document.getElementById('board');
    try {
      const events = await api('/api/events/bulletin');
      board.innerHTML = events.length
        ? events.map(noteHtml).join('')
        : '<div class="empty">No upcoming events yet.<br>Be the first to post one!</div>';
    } catch (err) {
      board.innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
    }
  })();
    </script>
</body>
</html>
