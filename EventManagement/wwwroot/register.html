<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register for an Event</title>
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <header class="top"><a class="brand" href="/index.html">UST Angelicum College · Event Management</a><nav id="nav"></nav></header>
    <main style="max-width:640px">
        <div class="card">
            <h1>Register for an Event</h1>
            <form id="form" novalidate>
                <label for="eventId">Event</label><select id="eventId"></select>
                <div class="hint" id="audience"></div>
                <label for="email">Email</label><input type="email" id="email" />
                <label for="fullName">Full name</label><input type="text" id="fullName" />
                <label for="yearLevel">Year level</label>
                <select id="yearLevel">
                    <option value="">Select…</option>
                    <option>Elementary</option>
                    <option>JHS</option>
                    <option>SHS</option>
                    <option>College</option>
                </select>
                <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:16px">
                    <input type="checkbox" id="confirmed" /> I confirm that my details are correct and I will attend this event.
                </label>
                <div class="msg" id="msg"></div>
                <div style="margin-top:14px"><button class="btn" type="submit" id="submitBtn">Register</button> <a class="btn ghost" href="/dashboard.html">Back</a></div>
            </form>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
