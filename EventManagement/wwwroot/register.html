<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register for an Event</title>
    <link rel="icon" type="image/png" href="/images/angelicum-logo.png" />
    <link rel="stylesheet" href="/css/site.css?v=20261115" />
</head>
<body>
    <header class="top"><a class="brand" href="/index.html"><img class="brand-logo" src="/images/angelicum-logo.png" alt="UST Angelicum College logo" />UST Angelicum College · Event Management</a><nav id="nav"></nav></header>
    <main style="max-width:640px">
        <div class="card">
            <h1>Register for an Event</h1>
            <div class="hint-box" id="who"></div>
            <form id="form" novalidate>
                <label for="eventId">Event</label><select id="eventId"></select>
                <div class="hint" id="audience"></div>
                <label for="email">Email</label><input type="email" id="email" />
                <label for="fullName">Full name</label><input type="text" id="fullName" />
                <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:16px">
                    <input type="checkbox" id="confirmed" /> I confirm that my details are correct and I will attend this event.
                </label>
                <div class="msg" id="msg"></div>
                <div style="margin-top:14px"><button class="btn" type="submit" id="submitBtn">Register</button> <a class="btn ghost" id="backLink" href="/dashboard.html">Back</a></div>
            </form>
        </div>
    </main>
    <script src="/js/api.js?v=20261115"></script>
    <script src="/js/register.js?v=20261115"></script>
</body>
</html>
