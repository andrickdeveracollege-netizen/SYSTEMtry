<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approvals – Event Management</title>
    <link rel="icon" type="image/png" href="/images/angelicum-logo.png" />
    <link rel="stylesheet" href="/css/site.css?v=20261115" />
    <link rel="stylesheet" href="/css/board.css?v=20261115" />
</head>
<body>
    <header class="top"><a class="brand" href="/index.html">UST Angelicum College · Event Management</a><nav id="nav"></nav></header>
    <main style="max-width:980px">
        <h1 id="office">Approvals</h1>
        <p class="muted">You only see the part of each event that needs your office.</p>
        <div id="officePick" style="display:none;margin-bottom:12px">
            <label for="officeSel">Office (super admin)</label>
            <select id="officeSel">
                <option value="Auxiliary">Auxiliary</option><option value="ITMC">ITMC</option>
                <option value="College">College</option><option value="TVET">TVET</option><option value="Library">Library</option>
            </select>
        </div>

        <div class="tabs" id="tabs">
            <button class="btn" data-tab="Pending" type="button">Pending</button>
            <button class="btn ghost" data-tab="Approved" type="button">Approved</button>
            <button class="btn ghost" data-tab="Rejected" type="button">Rejected</button>
            <button class="btn ghost" data-tab="Report" type="button">Report</button>
        </div>

        <div id="list"><div class="spinner">Loading…</div></div>
    </main>

    <div class="modal" id="rejectModal">
        <div class="card">
            <h2>Reject request</h2>
            <label for="reason">Reason (the requester will see this)</label>
            <textarea id="reason" maxlength="500"></textarea>
            <div class="msg" id="rejectMsg"></div>
            <div style="margin-top:12px">
                <button class="btn bad" id="confirmReject" type="button">Reject</button>
                <button class="btn ghost" id="closeReject" type="button">Close</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js?v=20261115"></script>
    <script src="/js/admin.js?v=20261115"></script>
</body>
</html>
